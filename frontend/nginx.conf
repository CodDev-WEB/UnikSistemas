# Rate limits are keyed by X-Real-IP from the trusted host-level reverse proxy.
# Docker Compose binds this frontend to loopback; the public proxy must overwrite
# X-Real-IP with its actual $remote_addr (never pass through a client-supplied value).
map $http_x_real_ip $request_rate_key {
    default $http_x_real_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $request_rate_key zone=auth_limit:5m rate=5r/m;
limit_req_zone $request_rate_key zone=bootstrap_limit:1m rate=2r/m;
limit_req_zone $request_rate_key zone=upload_info_limit:5m rate=30r/m;
limit_req_zone $request_rate_key zone=upload_file_limit:5m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    index index.html;

    # Baseline browser protections; TLS/HSTS must be enforced by the HTTPS edge proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Return a consistent JSON error for clients and a conservative retry hint.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Retry-After "60" always;
        return 429 '{"detail":"Muitas requisições. Aguarde e tente novamente."}';
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Authentication is deliberately more restrictive than ordinary API traffic.
    location = /api/v1/auth/token {
        limit_req zone=auth_limit burst=4 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Provisioning is operator-only and should be infrequent.
    location = /api/v1/setup/tenants {
        limit_req zone=bootstrap_limit burst=1 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Public metadata lookup may be used to display the upload form.
    location ~ ^/api/v1/public/document-upload/[^/]+$ {
        limit_req zone=upload_info_limit burst=10 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # File transfer gets a lower rate and remains subject to the API's size,
    # extension, expiration, revocation and per-link upload-count checks.
    location ~ ^/api/v1/public/document-upload/[^/]+/files$ {
        limit_req zone=upload_file_limit burst=2 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /health/ {
        proxy_pass http://api:8000/health/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
