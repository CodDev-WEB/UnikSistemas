name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unik
          POSTGRES_PASSWORD: unik_test_password
          POSTGRES_DB: unik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unik -d unik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: test-secret-key-with-more-than-thirty-two-characters
      DATABASE_URL: postgresql+psycopg://unik:unik_test_password@localhost:5432/unik_test
      BOOTSTRAP_TOKEN: test-bootstrap-token-with-more-than-thirty-two
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Run tests
        run: pytest -q
      - name: Verify database migrations
        run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
