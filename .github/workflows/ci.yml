name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unik
          POSTGRES_PASSWORD: unik_test_password
          POSTGRES_DB: unik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unik -d unik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: test-secret-key-with-more-than-thirty-two-characters
      DATABASE_URL: postgresql+psycopg://unik:unik_test_password@localhost:5432/unik_test
      BOOTSTRAP_TOKEN: test-bootstrap-token-with-more-than-thirty-two
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Run tests
        run: pytest -q
      - name: Validate operational shell scripts
        run: bash -n scripts/backup.sh scripts/restore.sh
      - name: Validate staging readiness CLI
        run: python scripts/staging_readiness.py --help
      - name: Verify database migrations
        run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Nginx rate-limit and reverse-proxy configuration
        run: |
          docker run --rm --add-host=api:127.0.0.1 \
            -v "$PWD/frontend:/fixture:ro" \
            nginx:1.27-alpine sh -c '
              mkdir -p /etc/nginx/snippets &&
              cp /fixture/nginx.conf /etc/nginx/conf.d/default.conf &&
              cp /fixture/snippets/api-proxy.conf /etc/nginx/snippets/api-proxy.conf &&
              nginx -t
            '
