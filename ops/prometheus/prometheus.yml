global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: unik-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
    authorization:
      type: Bearer
      credentials_file: /run/prometheus-secrets/metrics_token
