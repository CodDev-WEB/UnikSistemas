services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unik
      POSTGRES_USER: unik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unik -d unik"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set_DATABASE_URL_in_.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - document_uploads:/var/lib/unik/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3

  clamav:
    image: clamav/clamav:1.5_base
    restart: unless-stopped
    volumes:
      - clamav_database:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=3 --no-summary"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256

  document-scan-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set_DATABASE_URL_in_.env}
      ANTIVIRUS_HOST: clamav
      ANTIVIRUS_PORT: 3310
    command: ["python", "-m", "app.document_scan_worker"]
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - document_uploads:/var/lib/unik/uploads
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64

  notification-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set_DATABASE_URL_in_.env}
    command: ["python", "-m", "app.notification_worker"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run/prometheus-secrets:size=1m,mode=0700,uid=65534,gid=65534
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128

  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: console
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
      GF_PATHS_PLUGINS: /tmp/grafana-plugins
    entrypoint: ["/bin/sh", "/opt/unik-entrypoint.sh"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./ops/grafana/entrypoint.sh:/opt/unik-entrypoint.sh:ro
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=4m,mode=1777
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

volumes:
  postgres_data:
  document_uploads:
  clamav_database:
  prometheus_data:
  grafana_data:
